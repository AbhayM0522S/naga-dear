<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="48" height="48">
  <defs>
    <linearGradient id="featherGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F7931E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF4444;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E90FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4169E1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rooster body -->
  <ellipse cx="45" cy="55" rx="18" ry="22" fill="url(#bodyGradient)"/>
  
  <!-- Rooster head -->
  <circle cx="35" cy="38" r="12" fill="url(#bodyGradient)"/>
  
  <!-- Comb on head -->
  <path d="M 28 30 Q 30 25 32 28 Q 34 23 36 28 Q 38 25 40 30" fill="#FF4444" stroke="#FF6B35" stroke-width="1"/>
  
  <!-- Beak -->
  <path d="M 23 36 L 15 38 L 23 40 Z" fill="#FFD700"/>
  
  <!-- Eye -->
  <circle cx="32" cy="36" r="2" fill="#000"/>
  
  <!-- Tail feathers - sweeping upward and to the right -->
  <path d="M 55 50 Q 65 40 75 30 Q 70 45 65 55" fill="url(#featherGradient)" opacity="0.9"/>
  <path d="M 58 55 Q 70 48 80 35 Q 73 50 68 60" fill="url(#featherGradient)" opacity="0.85"/>
  <path d="M 60 60 Q 72 55 82 42 Q 75 55 70 65" fill="url(#featherGradient)" opacity="0.8"/>
  <path d="M 62 65 Q 74 62 84 50 Q 77 62 72 70" fill="url(#featherGradient)" opacity="0.75"/>
  
  <!-- Wing -->
  <path d="M 40 50 Q 50 55 55 65 Q 48 60 40 55 Z" fill="#4169E1" opacity="0.8"/>
  
  <!-- Leg -->
  <line x1="45" y1="75" x2="45" y2="85" stroke="#FFD700" stroke-width="2"/>
  <line x1="45" y1="85" x2="40" y2="90" stroke="#FFD700" stroke-width="1.5"/>
  <line x1="45" y1="85" x2="45" y2="90" stroke="#FFD700" stroke-width="1.5"/>
  <line x1="45" y1="85" x2="50" y2="90" stroke="#FFD700" stroke-width="1.5"/>
</svg>
